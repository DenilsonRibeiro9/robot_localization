navsat_transform:
  frequency: 50
  delay: 1.0
  magnetic_declination_radians: 0.0 #0.404392787687086  # For lat/long -21.838105872694417, -21.838105872694417
  yaw_offset: 0.0 #1.570796327  # IMU reads 0 facing magnetic north, not east
  zero_altitude: false
  broadcast_cartesian_transform: true
  publish_filtered_gps: true
  use_odometry_yaw: false
  wait_for_datum: false
  #datum: [-21.837790568569453, -43.38943274101644, 0.0]

